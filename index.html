<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>HN Reader — The conversations worth catching</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23ff7a1a'%3E%3Cpath d='M9.6 4.6h12.8l6.4 8L16 28.4 3.2 12.6z' opacity='.32'/%3E%3Cpath d='M9.6 4.6h12.8l-3.2 8h-6.4z'/%3E%3Cpath d='M12.8 12.6 16 28.4l3.2-15.8z' opacity='.8'/%3E%3C/g%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --surface-raised: #1c2129;
      --border: #30363d;
      --border-strong: #484f58;
      --accent: #ff7a1a;
      --accent-hover: #ff984d;
      --accent-soft: rgba(255, 122, 26, 0.12);
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --heading: #f0f3f6;
      --focus: #58a6ff;
      --radius: 10px;
      --content-width: 780px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-raised: #f6f8fa;
      --border: #d0d7de;
      --border-strong: #8c959f;
      --accent: #c54b00;
      --accent-hover: #9d3c00;
      --accent-soft: rgba(197, 75, 0, 0.09);
      --text: #24292f;
      --text-muted: #57606a;
      --heading: #1f2328;
      --focus: #0969da;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scrollbar-gutter: stable; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .site-header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-inner, .filter-inner, .status-bar, main {
      width: min(calc(100% - 32px), var(--content-width));
      margin-inline: auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-block: 22px;
    }

    h1 {
      margin: 0;
      color: var(--heading);
      font-size: clamp(1.35rem, 4vw, 1.65rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      width: 1.05em;
      height: 1.05em;
      flex: none;
      color: var(--accent);
      vertical-align: -0.12em;
    }

    .ember-mark {
      width: 1.1em;
      height: 1.1em;
      flex: none;
    }

    .segment-label .ember-mark {
      display: inline-block;
      margin-right: 4px;
      vertical-align: -0.17em;
    }

    .tagline {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .theme-toggle {
      min-width: 42px;
      min-height: 42px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-raised);
      color: var(--text);
      cursor: pointer;
    }

    .theme-toggle:hover { border-color: var(--border-strong); }

    .filter-shell {
      position: sticky;
      z-index: 10;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(10px);
      transition: box-shadow 0.15s;
    }

    @media (hover: none) {
      .filter-shell {
        background: var(--surface);
        backdrop-filter: none;
      }
    }

    .filter-inner {
      display: grid;
      grid-template-columns: 0.75fr 1.05fr 1.2fr;
      align-items: end;
      gap: 10px;
      padding-block: 12px;
    }

    .control-group {
      margin: 0;
      padding: 0;
      border: 0;
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    .control-group legend {
      padding: 0;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .segmented-control {
      display: grid;
      grid-template-columns: repeat(var(--segments), minmax(0, 1fr));
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    .segmented-control input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .segment-label {
      min-width: 0;
      min-height: 40px;
      padding: 9px 4px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .segment-label + input + .segment-label {
      border-left: 1px solid var(--border);
    }

    .segmented-control input:checked + .segment-label {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: inset 0 -2px var(--accent);
    }

    .segmented-control input:focus-visible + .segment-label {
      position: relative;
      z-index: 1;
      outline: 3px solid var(--focus);
      outline-offset: -3px;
    }

    .segment-label:hover { color: var(--text); }

    .filter-summary {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(calc(100% - 32px), var(--content-width));
      min-height: 44px;
      margin-inline: auto;
    }

    .filter-summary-text {
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.82rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filter-summary-toggle {
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-shell.is-stuck {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .filter-shell.is-stuck .filter-summary { display: flex; }
    .filter-shell.is-stuck:not(.is-expanded) .filter-inner { display: none; }

    .load-more, .retry-button {
      min-height: 40px;
      padding: 8px 16px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }

    .load-more:hover, .retry-button:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .status-bar {
      min-height: 42px;
      padding-block: 10px 2px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .status-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      display: grid;
      gap: 12px;
      padding-block: 12px 28px;
    }

    .story-card {
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      transition: border-color 0.15s, transform 0.15s;
    }

    .story-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .story-card.read .story-title,
    .story-card.read .story-context,
    .story-card.read .story-meta { opacity: 0.55; }

    .story-context {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin-bottom: 7px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .story-context a {
      color: inherit;
      text-decoration: none;
    }

    .story-context a:hover { color: var(--accent); text-decoration: underline; }

    .read-label {
      display: none;
      padding: 0 5px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.65rem;
      text-transform: uppercase;
    }

    .story-card.read .read-label { display: inline-block; }

    .story-title {
      color: var(--heading);
      font-size: 1.05rem;
      font-weight: 650;
      line-height: 1.38;
      text-decoration: none;
    }

    .story-title:hover { color: var(--accent); }

    .story-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      color: var(--text-muted);
      font-size: 0.77rem;
    }

    .ember-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px 1px 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 650;
      white-space: nowrap;
      cursor: help;
    }

    .ember-pill.flagged {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .action-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
    }

    .story-action {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 650;
      text-decoration: none;
    }

    .discuss-action {
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .discuss-action:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }

    .article-action {
      border: 1px solid var(--border);
      color: var(--text);
    }

    .article-action:hover { border-color: var(--border-strong); }

    .read-toggle {
      min-height: 38px;
      margin-left: auto;
      padding: 6px 2px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .read-toggle:hover { color: var(--text); text-decoration: underline; }

    .empty-state, .error-state {
      padding: 64px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state h2, .error-state h2 {
      margin: 0 0 6px;
      color: var(--heading);
      font-size: 1.05rem;
    }

    .empty-state p, .error-state p { margin: 0 0 16px; }

    .skeleton {
      min-height: 154px;
      overflow: hidden;
      position: relative;
    }

    .skeleton::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(139, 148, 158, 0.08), transparent);
      content: "";
      animation: shimmer 1.4s infinite;
      transform: translateX(-100%);
    }

    .skeleton-line {
      height: 11px;
      margin-bottom: 12px;
      border-radius: 20px;
      background: var(--surface-raised);
    }

    .skeleton-line.title { width: 80%; height: 18px; }
    .skeleton-line.short { width: 38%; }

    @keyframes shimmer { to { transform: translateX(100%); } }

    .load-more {
      width: 100%;
      margin-top: 4px;
      background: transparent;
      color: var(--accent);
    }

    footer {
      padding: 0 16px 28px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-align: center;
    }

    footer a { color: var(--text-muted); }
    footer a:hover { color: var(--accent); }

    @media (max-width: 680px) {
      .header-inner, .filter-inner, .status-bar, main {
        width: min(calc(100% - 24px), var(--content-width));
      }

      .filter-inner { grid-template-columns: 1fr; }
      .filter-summary { width: min(calc(100% - 24px), var(--content-width)); }
    }

    @media (max-width: 440px) {
      .story-card { padding: 15px; }
      .action-bar { flex-wrap: wrap; }
      .story-action { flex: 1; }
      .read-toggle { width: 100%; margin-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1><svg class="brand-mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><path d="M9.6 4.6h12.8l6.4 8L16 28.4 3.2 12.6z" opacity=".32" /><path d="M9.6 4.6h12.8l-3.2 8h-6.4z" /><path d="M12.8 12.6 16 28.4l3.2-15.8z" opacity=".8" /></svg> HN Reader</h1>
        <p class="tagline">The conversations worth catching</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Use light theme" title="Change theme">☀</button>
    </div>
  </header>

  <div class="filter-shell">
    <div class="filter-summary">
      <span class="filter-summary-text" id="filter-summary-text"></span>
      <button class="filter-summary-toggle" id="filter-summary-toggle" type="button" aria-expanded="false" aria-controls="filter-form">Filters</button>
    </div>
    <form class="filter-inner" id="filter-form">
      <fieldset class="control-group">
        <legend>Timeframe</legend>
        <div class="segmented-control" style="--segments: 4">
          <input id="timeframe-24h" name="timeframe" type="radio" value="86400" />
          <label class="segment-label" for="timeframe-24h">24h</label>
          <input id="timeframe-3d" name="timeframe" type="radio" value="259200" />
          <label class="segment-label" for="timeframe-3d">3d</label>
          <input id="timeframe-7d" name="timeframe" type="radio" value="604800" />
          <label class="segment-label" for="timeframe-7d">7d</label>
          <input id="timeframe-30d" name="timeframe" type="radio" value="2592000" />
          <label class="segment-label" for="timeframe-30d">30d</label>
        </div>
      </fieldset>
      <fieldset class="control-group">
        <legend>Minimum Ember</legend>
        <div class="segmented-control" style="--segments: 5">
          <input id="ember-0" name="minEmber" type="radio" value="0" />
          <label class="segment-label" for="ember-0">Any</label>
          <input id="ember-75" name="minEmber" type="radio" value="7.5" />
          <label class="segment-label" for="ember-75">7.5+</label>
          <input id="ember-85" name="minEmber" type="radio" value="8.5" />
          <label class="segment-label" for="ember-85">8.5+</label>
          <input id="ember-90" name="minEmber" type="radio" value="9" />
          <label class="segment-label" for="ember-90">9+</label>
          <input id="ember-95" name="minEmber" type="radio" value="9.5" />
          <label class="segment-label" for="ember-95">9.5+</label>
        </div>
      </fieldset>
      <fieldset class="control-group">
        <legend>Sort by</legend>
        <div class="segmented-control" style="--segments: 4">
          <input id="sort-ember" name="sort" type="radio" value="ember" />
          <label class="segment-label" for="sort-ember" title="Maturity-adjusted score that rewards discussion but penalises flamewars"><svg class="ember-mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><path d="M9.6 4.6h12.8l6.4 8L16 28.4 3.2 12.6z" opacity=".32" /><path d="M9.6 4.6h12.8l-3.2 8h-6.4z" /><path d="M12.8 12.6 16 28.4l3.2-15.8z" opacity=".8" /></svg>Ember</label>
          <input id="sort-comments" name="sort" type="radio" value="comments" />
          <label class="segment-label" for="sort-comments">Comments</label>
          <input id="sort-points" name="sort" type="radio" value="points" />
          <label class="segment-label" for="sort-points">Points</label>
          <input id="sort-recent" name="sort" type="radio" value="recent" />
          <label class="segment-label" for="sort-recent">Recent</label>
        </div>
      </fieldset>
    </form>
  </div>

  <div class="status-bar" id="status-bar" role="status" aria-live="polite"></div>
  <main id="story-list" aria-busy="true"></main>

  <footer>
    Data from <a href="https://hn.algolia.com/api" target="_blank" rel="noopener noreferrer">HN Algolia API</a>
    · Stories from <a href="https://news.ycombinator.com" target="_blank" rel="noopener noreferrer">Hacker News</a>
  </footer>

  <template id="ember-mark-template"><svg class="ember-mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><path d="M9.6 4.6h12.8l6.4 8L16 28.4 3.2 12.6z" opacity=".32" /><path d="M9.6 4.6h12.8l-3.2 8h-6.4z" /><path d="M12.8 12.6 16 28.4l3.2-15.8z" opacity=".8" /></svg></template>

  <script>
    const READ_KEY = 'hn_read_stories';
    const FILTER_KEY = 'hn_reader_filters';
    const THEME_KEY = 'hn_reader_theme';
    const EMBER_KEY = 'hn_reader_ember';
    const PAGE_SIZE = 25;
    const MAX_API_PAGES = 10;
    const API_HITS_PER_PAGE = 100;

    // Ember: log-magnitude of a story's reception, discounted when the
    // comment-to-point ratio says "argument" rather than "substance", and
    // projected forward so young stories compete fairly with mature ones.
    // The scale is absolute and logarithmic: +1 is roughly 2.7x the reception.
    const EMBER_DEFAULTS = { heat: 1.2, weight: 1.5, maturity: 6, endorsement: 150, bar: 9.5 };
    const EMBER_LIMITS = { heat: [0.05, 20], weight: [0, 6], maturity: [0.5, 72], endorsement: [1, 10000], bar: [0, 20] };
    const EMBER_COMMENT_WEIGHT = 0.5;
    const EMBER_MATURITY_FLOOR = 0.2;
    // Endorsement damping never falls below this. The magnitude term already
    // adds EMBER_COMMENT_WEIGHT per log-unit of comments, so once the damped
    // penalty slope drops under that, extra comments start helping again and
    // the inverted-U collapses into the flamewar-rewards-you behaviour Ember
    // exists to prevent. The floor keeps weight * damping above 0.5.
    const EMBER_ENDORSEMENT_FLOOR = 0.4;
    const EMBER_STALENESS_WEIGHT = 0.25;
    const EMBER_STALENESS_GRACE_HOURS = 24;

    // The API returns at most 1,000 hits, newest first, so an unfiltered long
    // window would silently drop its older half. These floors keep every
    // window under that cap; they sit far below anything Ember can rank.
    const MIN_POINTS_BY_TIMEFRAME = { 86400: 5, 259200: 10, 604800: 20, 2592000: 200 };
    const DEFAULT_MIN_POINTS = 20;
    const RECENT_BAND_SECONDS = 86400;

    const state = {
      stories: [],
      visibleCount: PAGE_SIZE,
      isLoading: false,
      isTruncated: false,
      requestId: 0,
      controller: null,
      ember: { ...EMBER_DEFAULTS }
    };

    const elements = {
      form: document.getElementById('filter-form'),
      filterShell: document.querySelector('.filter-shell'),
      filterSummary: document.getElementById('filter-summary-text'),
      filterToggle: document.getElementById('filter-summary-toggle'),
      status: document.getElementById('status-bar'),
      list: document.getElementById('story-list'),
      theme: document.getElementById('theme-toggle'),
      emberMark: document.getElementById('ember-mark-template')
    };

    function emberMark() {
      return elements.emberMark.content.firstElementChild.cloneNode(true);
    }

    function emberParamName(key) {
      return `ember${key[0].toUpperCase()}${key.slice(1)}`;
    }

    function readStoredObject(key) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '{}');
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      } catch {
        return {};
      }
    }

    function readEmberConfig() {
      const params = new URLSearchParams(location.search);
      const saved = readStoredObject(EMBER_KEY);
      const config = { ...EMBER_DEFAULTS };
      Object.keys(EMBER_DEFAULTS).forEach(key => {
        const raw = params.get(emberParamName(key)) ?? saved[key];
        if (raw === null || raw === undefined || raw === '') return;
        const value = Number(raw);
        const [min, max] = EMBER_LIMITS[key];
        if (Number.isFinite(value) && value >= min && value <= max) config[key] = value;
      });
      return config;
    }

    function emberScore(story, nowSeconds, config) {
      const points = Math.max(0, Number(story.points) || 0);
      const comments = Math.max(0, Number(story.num_comments) || 0);
      const ageHours = Math.max(0, (nowSeconds - (Number(story.created_at_i) || nowSeconds)) / 3600);

      // Votes and comments accrue on a saturating curve, so raw counts censor
      // anything recent. Divide by the share of that curve already elapsed.
      const maturity = Math.max(1 - Math.exp(-ageHours / config.maturity), EMBER_MATURITY_FLOOR);
      const magnitude = Math.log(points / maturity + 1)
        + EMBER_COMMENT_WEIGHT * Math.log(comments / maturity + 1);

      // Discussion is worth something, but past the threshold extra comments
      // signal repetition rather than depth. That reading only holds while few
      // people have endorsed the story: once many have, the same ratio
      // describes a widely approved but divisive piece, which is signal. Damp
      // the penalty by how much endorsement the story has actually collected.
      const ratio = (comments + 1) / (points + 1);
      const endorsement = Math.max(config.endorsement / (config.endorsement + points), EMBER_ENDORSEMENT_FLOOR);
      const heat = config.weight * endorsement * Math.max(0, Math.log(ratio / config.heat));

      const staleness = EMBER_STALENESS_WEIGHT
        * Math.max(0, Math.log(Math.max(ageHours, 1) / EMBER_STALENESS_GRACE_HOURS));

      return magnitude - heat - staleness;
    }

    function scoreStories(stories) {
      const nowSeconds = Date.now() / 1000;
      return stories.map(story => ({ ...story, ember: emberScore(story, nowSeconds, state.ember) }));
    }

    function getReadSet() {
      try {
        const stored = JSON.parse(localStorage.getItem(READ_KEY) || '[]');
        return new Set(Array.isArray(stored) ? stored.map(String) : []);
      } catch {
        return new Set();
      }
    }

    function setRead(id, isRead) {
      const readSet = getReadSet();
      if (isRead) readSet.add(String(id));
      else readSet.delete(String(id));
      localStorage.setItem(READ_KEY, JSON.stringify([...readSet]));

      const card = elements.list.querySelector(`[data-story-id="${CSS.escape(String(id))}"]`);
      if (!card) return;
      card.classList.toggle('read', isRead);
      const toggle = card.querySelector('.read-toggle');
      toggle.textContent = isRead ? 'Mark unread' : 'Mark read';
      toggle.setAttribute('aria-pressed', String(isRead));
    }

    function relativeTime(unixTimestamp) {
      const diff = Math.max(0, Math.floor(Date.now() / 1000) - Number(unixTimestamp || 0));
      if (diff < 60) return 'just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
      return `${Math.floor(diff / 604800)}w ago`;
    }

    function safeArticleUrl(url) {
      if (!url) return null;
      try {
        const parsed = new URL(url);
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : null;
      } catch {
        return null;
      }
    }

    function extractDomain(url) {
      if (!url) return null;
      try {
        return new URL(url).hostname.replace(/^www\./, '');
      } catch {
        return null;
      }
    }

    function appendText(parent, text) {
      parent.append(document.createTextNode(text));
    }

    function setStatus(message, loading = false) {
      elements.status.replaceChildren();
      const content = document.createElement('div');
      content.className = 'status-content';
      if (loading) {
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.setAttribute('aria-hidden', 'true');
        content.append(spinner);
      }
      appendText(content, message);
      elements.status.append(content);
    }

    function renderSkeletons() {
      elements.list.replaceChildren();
      for (let index = 0; index < 4; index += 1) {
        const skeleton = document.createElement('div');
        skeleton.className = 'story-card skeleton';
        skeleton.setAttribute('aria-hidden', 'true');
        ['short', 'title', '', 'short'].forEach(kind => {
          const line = document.createElement('div');
          line.className = `skeleton-line ${kind}`.trim();
          skeleton.append(line);
        });
        elements.list.append(skeleton);
      }
    }

    function makeLink(className, label, href) {
      const link = document.createElement('a');
      link.className = className;
      link.textContent = label;
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      return link;
    }

    function createStoryCard(story) {
      const hnUrl = `https://news.ycombinator.com/item?id=${encodeURIComponent(story.objectID)}`;
      const articleUrl = safeArticleUrl(story.url);
      const titleUrl = articleUrl || hnUrl;
      const domain = extractDomain(articleUrl);
      const isRead = getReadSet().has(String(story.objectID));

      const article = document.createElement('article');
      article.className = `story-card${isRead ? ' read' : ''}`;
      article.dataset.storyId = String(story.objectID);

      const context = document.createElement('div');
      context.className = 'story-context';
      if (domain) {
        const source = makeLink('', domain, articleUrl);
        source.setAttribute('aria-label', `Read article on ${domain}`);
        source.dataset.readTarget = String(story.objectID);
        context.append(source);
        appendText(context, ' · ');
      }
      appendText(context, `${relativeTime(story.created_at_i)} · by ${story.author || 'unknown'} · #${story.rank}`);
      const readLabel = document.createElement('span');
      readLabel.className = 'read-label';
      readLabel.textContent = 'Read';
      context.append(' ', readLabel);

      const heading = document.createElement('h2');
      heading.style.margin = '0';
      heading.style.fontSize = 'inherit';
      const title = makeLink('story-title', story.title || '(untitled)', titleUrl);
      title.dataset.readTarget = String(story.objectID);
      heading.append(title);

      const meta = document.createElement('div');
      meta.className = 'story-meta';
      const commentCount = Number(story.num_comments || 0);
      appendText(
        meta,
        `${Number(story.points || 0).toLocaleString()} points · ${commentCount.toLocaleString()} ${commentCount === 1 ? 'comment' : 'comments'}`
      );

      const isFlagged = Number(story.ember) >= state.ember.bar;
      const score = Number(story.ember).toFixed(1);
      const ember = document.createElement('span');
      ember.className = `ember-pill${isFlagged ? ' flagged' : ''}`;
      ember.append(emberMark(), document.createTextNode(isFlagged ? `${score} · don't miss` : score));
      ember.setAttribute('aria-label', isFlagged ? `Ember ${score}, not to miss` : `Ember ${score}`);
      ember.title = `Ember ${score} on an absolute log scale — every +1 is roughly 2.7x the reception.`
        + `\nStories at or above ${state.ember.bar} are flagged as not to miss.`;
      meta.append(ember);

      const actions = document.createElement('div');
      actions.className = 'action-bar';
      const discuss = makeLink('story-action discuss-action', 'HN comments', hnUrl);
      discuss.dataset.readTarget = String(story.objectID);
      actions.append(discuss);

      if (articleUrl) {
        const readArticle = makeLink('story-action article-action', 'Submission', articleUrl);
        readArticle.dataset.readTarget = String(story.objectID);
        actions.append(readArticle);
      }

      const readToggle = document.createElement('button');
      readToggle.className = 'read-toggle';
      readToggle.type = 'button';
      readToggle.textContent = isRead ? 'Mark unread' : 'Mark read';
      readToggle.setAttribute('aria-pressed', String(isRead));
      readToggle.addEventListener('click', () => {
        setRead(story.objectID, !article.classList.contains('read'));
      });
      actions.append(readToggle);

      article.append(context, heading, meta, actions);
      return article;
    }

    function renderStories() {
      elements.list.replaceChildren();
      const visibleStories = state.stories.slice(0, state.visibleCount);

      if (!visibleStories.length) {
        const empty = document.createElement('section');
        empty.className = 'empty-state';
        const heading = document.createElement('h2');
        heading.textContent = 'No conversations found';
        const detail = document.createElement('p');
        detail.textContent = 'Try a longer timeframe or a lower Ember minimum.';
        empty.append(heading, detail);
        elements.list.append(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      visibleStories.forEach(story => fragment.append(createStoryCard(story)));
      elements.list.append(fragment);

      if (state.visibleCount < state.stories.length) {
        const loadMore = document.createElement('button');
        loadMore.className = 'load-more';
        loadMore.type = 'button';
        loadMore.textContent = `Show more (${state.stories.length - state.visibleCount} remaining)`;
        loadMore.addEventListener('click', () => {
          state.visibleCount += PAGE_SIZE;
          renderStories();
          const nextButton = elements.list.querySelector('.load-more');
          if (nextButton) nextButton.focus();
        });
        elements.list.append(loadMore);
      }
    }

    function getFilters() {
      const data = new FormData(elements.form);
      return {
        timeframe: Number(data.get('timeframe')),
        minEmber: Number(data.get('minEmber')),
        sort: String(data.get('sort'))
      };
    }

    function selectFilter(name, value, fallback) {
      const options = [...elements.form.querySelectorAll(`input[name="${name}"]`)];
      const selected = options.find(option => option.value === String(value))
        || options.find(option => option.value === fallback);
      if (selected) selected.checked = true;
    }

    function selectedFilterLabel(name) {
      const selected = elements.form.querySelector(`input[name="${name}"]:checked`);
      return selected ? elements.form.querySelector(`label[for="${selected.id}"]`).textContent : '';
    }

    function updateFilterSummary() {
      elements.filterSummary.textContent = [
        selectedFilterLabel('timeframe'),
        `Ember ${selectedFilterLabel('minEmber')}`,
        selectedFilterLabel('sort')
      ].join(' · ');
    }

    function applySavedFilters() {
      const saved = readStoredObject(FILTER_KEY);
      const params = new URLSearchParams(location.search);
      const values = {
        timeframe: params.get('timeframe') || saved.timeframe || '604800',
        minEmber: params.get('minEmber') ?? saved.minEmber ?? '8.5',
        sort: params.get('sort') || saved.sort || 'ember'
      };
      selectFilter('timeframe', values.timeframe, '604800');
      selectFilter('minEmber', values.minEmber, '8.5');
      selectFilter('sort', values.sort, 'ember');
      state.ember = readEmberConfig();
      updateFilterSummary();
    }

    function saveFilters(filters) {
      localStorage.setItem(FILTER_KEY, JSON.stringify(filters));
      localStorage.setItem(EMBER_KEY, JSON.stringify(state.ember));
      const params = new URLSearchParams();
      params.set('timeframe', filters.timeframe);
      params.set('minEmber', filters.minEmber);
      params.set('sort', filters.sort);
      Object.keys(EMBER_DEFAULTS).forEach(key => {
        if (state.ember[key] !== EMBER_DEFAULTS[key]) params.set(emberParamName(key), state.ember[key]);
      });
      history.replaceState(null, '', `${location.pathname}?${params}`);
    }

    function sortStories(stories, sortBy) {
      const comparisons = {
        ember: (a, b) => Number(b.ember || 0) - Number(a.ember || 0),
        comments: (a, b) => Number(b.num_comments || 0) - Number(a.num_comments || 0),
        points: (a, b) => Number(b.points || 0) - Number(a.points || 0),
        recent: (a, b) => Number(b.created_at_i || 0) - Number(a.created_at_i || 0)
      };
      return stories.sort(comparisons[sortBy] || comparisons.ember);
    }

    async function fetchApiPage(baseUrl, page, signal) {
      const response = await fetch(`${baseUrl}&page=${page}`, { signal });
      if (!response.ok) throw new Error(`The news service returned HTTP ${response.status}.`);
      return response.json();
    }

    // A high floor on a long window would hide fresh stories that Ember's
    // maturity projection already rates highly, so the recent band is fetched
    // separately at the lower floor its own window would use. Overlapping hits
    // are deduplicated by objectID.
    function windowQueries(timeframe) {
      const now = Math.floor(Date.now() / 1000);
      const minPoints = MIN_POINTS_BY_TIMEFRAME[timeframe] ?? DEFAULT_MIN_POINTS;
      const queries = [{ since: now - timeframe, minPoints }];
      const bandMinPoints = MIN_POINTS_BY_TIMEFRAME[RECENT_BAND_SECONDS];
      if (timeframe > RECENT_BAND_SECONDS && minPoints > bandMinPoints) {
        queries.push({ since: now - RECENT_BAND_SECONDS, minPoints: bandMinPoints });
      }
      return queries;
    }

    async function fetchWindow({ since, minPoints }, signal) {
      const numericFilters = encodeURIComponent(`created_at_i>${since},points>=${minPoints}`);
      const baseUrl = `https://hn.algolia.com/api/v1/search_by_date?tags=story&numericFilters=${numericFilters}&hitsPerPage=${API_HITS_PER_PAGE}`;
      const firstPage = await fetchApiPage(baseUrl, 0, signal);
      const pageCount = Math.min(Number(firstPage.nbPages || 1), MAX_API_PAGES);
      const remaining = await Promise.all(
        Array.from({ length: Math.max(0, pageCount - 1) }, (_, index) => fetchApiPage(baseUrl, index + 1, signal))
      );
      return {
        hits: [firstPage, ...remaining].flatMap(page => Array.isArray(page.hits) ? page.hits : []),
        // nbPages is itself clamped to the 1,000-hit cap, so it can never
        // exceed MAX_API_PAGES. Only nbHits reports the true match count.
        truncated: Number(firstPage.nbHits || 0) > MAX_API_PAGES * API_HITS_PER_PAGE
      };
    }

    async function fetchStories() {
      if (!elements.form.reportValidity()) return;
      const filters = getFilters();
      saveFilters(filters);
      updateFilterSummary();

      state.controller?.abort();
      state.controller = new AbortController();
      const { signal } = state.controller;
      const requestId = ++state.requestId;

      state.isLoading = true;
      state.visibleCount = PAGE_SIZE;
      elements.list.setAttribute('aria-busy', 'true');
      setStatus('Finding conversations…', true);
      renderSkeletons();

      try {
        const results = await Promise.all(
          windowQueries(filters.timeframe).map(query => fetchWindow(query, signal))
        );
        if (requestId !== state.requestId) return;
        const hits = results.flatMap(result => result.hits);
        const uniqueHits = [...new Map(hits.map(hit => [String(hit.objectID), hit])).values()];
        const scored = scoreStories(uniqueHits).filter(story => story.ember >= filters.minEmber);
        state.stories = sortStories(scored, filters.sort).map((story, index) => ({ ...story, rank: index + 1 }));
        state.isTruncated = results.some(result => result.truncated);

        const timeframeLabel = selectedFilterLabel('timeframe');
        const truncation = state.isTruncated ? ' · first 1,000 matches' : '';
        const flagged = state.stories.filter(story => Number(story.ember) >= state.ember.bar).length;
        const mustRead = flagged ? ` · ${flagged.toLocaleString()} not to miss` : '';
        const emberLabel = filters.minEmber > 0 ? `Ember ${filters.minEmber}+` : 'any Ember';
        setStatus(
          `${state.stories.length.toLocaleString()} ${state.stories.length === 1 ? 'story' : 'stories'} · ${timeframeLabel} · ${emberLabel}${mustRead}${truncation}`
        );
        renderStories();
      } catch (error) {
        if (error instanceof DOMException && error.name === 'AbortError') return;
        setStatus('Stories could not be loaded.');
        elements.list.replaceChildren();
        const section = document.createElement('section');
        section.className = 'error-state';
        const heading = document.createElement('h2');
        heading.textContent = 'Something went wrong';
        const detail = document.createElement('p');
        detail.textContent = error instanceof Error ? error.message : 'Please try again.';
        const retry = document.createElement('button');
        retry.className = 'retry-button';
        retry.type = 'button';
        retry.textContent = 'Try again';
        retry.addEventListener('click', fetchStories);
        section.append(heading, detail, retry);
        elements.list.append(section);
      } finally {
        if (requestId === state.requestId) {
          state.isLoading = false;
          state.controller = null;
          elements.list.setAttribute('aria-busy', 'false');
        }
      }
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem(THEME_KEY, theme);
      const useLight = theme === 'dark';
      elements.theme.textContent = useLight ? '☀' : '☾';
      elements.theme.setAttribute('aria-label', `Use ${useLight ? 'light' : 'dark'} theme`);
    }

    function initializeTheme() {
      const stored = localStorage.getItem(THEME_KEY);
      const preferred = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      setTheme(stored === 'light' || stored === 'dark' ? stored : preferred);
    }

    elements.form.addEventListener('change', () => {
      elements.filterShell.classList.remove('is-expanded');
      elements.filterToggle.setAttribute('aria-expanded', 'false');
      fetchStories();
    });
    elements.form.addEventListener('submit', event => event.preventDefault());
    elements.filterToggle.addEventListener('click', () => {
      const isExpanded = elements.filterShell.classList.toggle('is-expanded');
      elements.filterToggle.setAttribute('aria-expanded', String(isExpanded));
    });
    elements.list.addEventListener('click', event => {
      const link = event.target.closest('[data-read-target]');
      if (link) setRead(link.dataset.readTarget, true);
    });
    elements.theme.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    applySavedFilters();
    initializeTheme();
    const siteHeader = document.querySelector('.site-header');
    let stuck = false;
    let stickyFrame = 0;

    function updateStuckState() {
      stickyFrame = 0;
      const headerHeight = siteHeader.offsetHeight;
      // Hysteresis: collapsing the filter shell shortens the page, so a single
      // threshold can flip the state back and forth and cause scroll jitter.
      // We must offset the unstuck threshold by more than the height lost when it collapses,
      // otherwise scroll anchoring will instantly pull the scroll position below the threshold.
      const threshold = stuck ? headerHeight : headerHeight + elements.filterShell.offsetHeight + 10;
      const nextStuck = window.scrollY > threshold;
      if (nextStuck === stuck) return;
      stuck = nextStuck;
      elements.filterShell.classList.toggle('is-stuck', stuck);
      if (!stuck) {
        elements.filterShell.classList.remove('is-expanded');
        elements.filterToggle.setAttribute('aria-expanded', 'false');
      }
    }

    function scheduleStuckUpdate() {
      if (stickyFrame) return;
      stickyFrame = requestAnimationFrame(updateStuckState);
    }

    window.addEventListener('scroll', scheduleStuckUpdate, { passive: true });
    window.addEventListener('resize', scheduleStuckUpdate);
    updateStuckState();
    fetchStories();
  </script>
</body>
</html>
